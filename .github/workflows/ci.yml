# main 的分支保护把 verify 设成必过项：改 job 名要同时改分支保护，否则所有 PR 都合不进去。
# 不加路径过滤：被过滤掉的 PR 不会产生 verify，会一直等下去。
# 分支的 push 不跑：每个改动都走 PR，PR 会检查与 main 合并后的结果；再跑一遍 push 只是同一份检查多等 10 分钟（DECISIONS §48）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只需要最新一次的结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建需要 local/manifest-key.txt。这里生成的密钥只活在这台 runner 上，不用任何 Secret。
      - name: Generate throwaway extension key
        run: npm run setup

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium for e2e
        run: npm run e2e:install

      - name: End-to-end and production smoke tests
        run: npm run e2e

      - name: Upload diagnostic results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
